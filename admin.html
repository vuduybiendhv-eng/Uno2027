<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNO Tết 2027 · Chủ LIVE</title><link rel="stylesheet" href="/style.css"></head><body>
<header class="hero"><div class="eyebrow">BẢNG ĐIỀU KHIỂN</div><h1>🎙️ CHỦ LIVE <span>UNO TẾT</span></h1><p>Chủ LIVE cũng là người chơi trong bàn 6 người</p><a class="admin-link" href="/">← Trang người chơi</a></header>
